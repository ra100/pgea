[package]
name = "pgea"
version = "0.2.1"
edition = "2021"
description = "Local PostgreSQL wire-protocol proxy that translates queries into AWS RDS Data API calls."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ra100/pgea"

[[bin]]
name = "pgea"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
regex = "1"
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-rdsdata = "1"
pgwire = "0.40"

[dev-dependencies]
tempfile = "3"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-postgres = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
