[package]
name = "pg-rds-connector"
version = "0.1.0"
edition = "2021"
description = "Local PostgreSQL wire-protocol proxy that translates queries into AWS RDS Data API calls."
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
