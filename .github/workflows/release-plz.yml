name: release-plz

# Two independent jobs on every push to main:
# - release-plz-pr: opens/updates a PR bumping Cargo.toml + CHANGELOG.md from
#   conventional commits. Merging that PR is what bumps the version on main.
# - release-plz-release: publishes to crates.io whenever main's Cargo.toml
#   version isn't on the registry yet (i.e. right after the PR above merges).
#
# GitHub releases + binaries are NOT this workflow's job: autotag.yml watches
# Cargo.toml for the version change and tags + kicks off release.yml, which
# builds and publishes the binaries for install.sh.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    if: github.repository == 'ra100/pgea'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    if: github.repository == 'ra100/pgea'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
